name: Guard: Build Flags

on:
  push:
  pull_request:

jobs:
  check-build-flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Run build flags check
        run: |
          python3 scripts/check_build_flags.py
